<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin & Padding</title>
    <style>
        .div1
        {
          width: 200px;
          height: 200px;
          padding:30px;
          margin:50px;
          border: 2px solid red;  
        }
        .div2
        {
            width: 200px;
            height: 200px;
            padding: 20px 30px 40px 50px;
            margin: auto;
            border: 2px dotted green;
        }
        button
        {
            padding: 40px 30px;

        }
    </style>
</head>
<body>
    <div class="div1">
        <h1>Hello World!</h1>
    </div>

    <div class="div2">
        <h1>Hello World!</h1>
    </div>

    <button>
        Click me
    </button>
</body>
</html>
