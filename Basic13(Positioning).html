<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <style>
        /* static */
        .box1
        {
            width: 200px;
            height: 200px;
            border: 2px solid green;
            position: static;
            top: 50px; /* don't effect*/
            left:50px; /* don't effect */
        }

        .box2
        {
            width: 200px;
            height: 200px;
            border: 2px solid red;
            position: relative;
            top:50px;
            left:50px;
        }

        /* Relative with Negative Values */
        input
        {
            width: 200px;
            height: 30px;
        }
        .search
        {
            width:80px;
            height: 35px;
            border-radius:20px;
            position: relative;
            left:-30px;
        }

        /* absolute with relative */
        .parent
        {
            width: 300px;
            height: 300px;
            border:2px solid blue;
            position: relative;
        }

        .child
        {
            width:200px;
            height: 200px;
            border:2px solid red;
            position: absolute;
            top:70px;
            left:30px;
        }


        .card
        {
            width:300px;
            padding: 30px;
            border: 1px solid grey;
            position: relative;
        }
        .badge
        {
            position: absolute;
            top:10px;
            right:10px;
          background-color: red; 
          color: white; 
          border-radius: 5px;
          padding: 5px 10px;
        }
        

        .help-btn
        {
            position: fixed;
            bottom: 20px;
            right:20px;
           
            padding: 15px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 50px;
        }

    </style>
</head>
<body>

    

    <div class="box1">
        Box1
    </div>

    <div class="box2">
        Box2
    </div>

    <input type="text" placeholder="Please search Here"><button class="search">Search</button>

    <div class="parent">
        <h3>Parent Div</h3>
        <div class="child">
            <h3>Child Div</h3>
        </div>
    </div>

    <hr>
    <h1>Absolute</h1>
    <div class="card">
        <div class="badge">
            sale
        </div>
        <h2>Smart Watch</h2>
        <p>Rs.1999</p>
    </div>

    <hr>
    <button class="help-btn">
        Help
    </button>

</body>
</html>
