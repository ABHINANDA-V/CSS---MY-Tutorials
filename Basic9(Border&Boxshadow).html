<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border & Box Shadow</title>
    <style>
        .div1
        {
            width:200px;
            height: 200px;
            background-color: magenta;
            border: 2px dotted green;
            border-radius: 50px;
            box-shadow: 4px 4px 16px yellow;
        }
        h1
        {
            text-shadow: 3px 2px 8px red;
        }
    </style>
</head>
<body>
    <div class="div1">
        <h1>Hello World!</h1>
    </div>
    
</body>
</html>
