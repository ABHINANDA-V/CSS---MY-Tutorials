<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colours</title>
    <style>
      h1 {
        color: green;
      }
      h2 {
        color: #aaaabb;
      }
      h3 {
        color: rgb(250, 80, 99);
      }
      h4 {
        color: rgba(210, 60, 50, 0.1);
      }


      div
      {
        width: 700px;
        height: 200px;
        background-color: aquamarine;
      }
    </style>
  </head>
  <body>
    <h1>Hello Welcome to the Universe!</h1>
    <h2>Hello Welcome to the World!</h2>
    <h3>Hello Welcome to the Earth!</h3>
    <h4>Hello Welcome to the Home!</h4>

    <div>
      <h1>Hello Welcome to the Universe!</h1>
      <h2>Hello Welcome to the World!</h2>
      <h3>Hello Welcome to the Earth!</h3>
      <h4>Hello Welcome to the Home!</h4>
    </div>
  </body>
</html>
