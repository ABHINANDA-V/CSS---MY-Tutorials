<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS & Internal CSS</title>

    <!-- internal css -->
    <style>
        h2
        {
            color: yellow;
            background-color: green;
        }
        .para
        {
            color: olive;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- inline css -->
    <h1 style="color: blue;font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Welcome To the Inline CSS</h1>
    <p style="color: violet;font-style: italic;">Inline CSS is written inside the HTML element using the style attribute.</p>

    <h2>Welcome to the Internal CSS</h2>
    <p class="para">Internal CSS is written inside the style tag.The style tag is placed inside the head section.</p>
</body>
</html>
