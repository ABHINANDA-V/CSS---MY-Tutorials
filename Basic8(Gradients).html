<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
    <style>
        .div1
        {
            width: 400px;
            height: 400px;
            background:linear-gradient(to right, red, yellow);
        }

        .div2
        {
            width:200px;
            height: 200px;
            background:radial-gradient(pink,green,brown);
        }
    </style>
</head>
<body>
    <div class="div1">
        <h1>Hello World!</h1>
    </div>

    <div class="div2">
        <h1>Hello World</h1>
    </div>
</body>
</html>
